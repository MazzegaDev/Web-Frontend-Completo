<!DOCTYPE html>
<html>
<head>
	<title>Adicionando e removendo elementos</title>
</head>
<body>

    <ul id="itens">
        <li>Pedro</li>
        <li>Ana</li>
    </ul>
    <hr>
    <p id="item-clonar">Tamires</p>

    <button onclick="adicionar()">Adicionar</button>
    <button onclick="remover()">Remover</button>
	<script type="text/javascript">
        const ul = document.getElementById('itens')
        const li = document.createElement('li')

        const ulFilha = document.createElement('ul')
        const lIFilha = document.createElement('li')
        lIFilha.textContent = 'Li criada'
        ulFilha.appendChild(lIFilha)
        // li.setAttribute('teste', 10)
        // li.textContent = 'Guilherme'
        const texto = document.createTextNode('Guilherme')
        
		function adicionar(){
            // li.appendChild(texto)
            // ul.appendChild(li)

            li.appendChild(texto)
            ul.insertBefore(li, ul.children[0])
            const clone = document.getElementById('item-clonar')
            const item = clone.cloneNode(true)
            ul.appendChild(item)
        }
        function remover(){
            ul.removeChild(li)
        }
	</script>

</body>

</html>
