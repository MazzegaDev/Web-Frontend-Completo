<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid - Desfio estrutura simples</title>
    <style>
        /* 
            
        */
        body{
            font-size: 3rem;
            background-color: black;
            color: white;
            margin: 0;
            padding: 20px;
            /* border: 3px solid red; */
        }

        .grid{
            /* height: 100vh; */
            display: grid;
            /* border: 3px solid blue; */
            grid-template-columns: [a]1fr [b] 1fr [c] 1fr [d];
            /* grid-template-rows: 30% 100px 4fr 1fr; */
            row-gap: 20px;
            column-gap: 20px;
        }

        .item2{
            grid-column:span 2;
        }
        .item3{
            grid-column: span 2;
        }

        .item4{
           grid-row: span 2;
        }

        .item7{
            grid-column: a / d;
        }
        .grid > div{
            border: 5px solid pink;
        }
    </style>
</head>
<body>

    <div class="grid">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
        <div class="item6">6</div>
        <div class="item7">7</div>
    </div>

</body>
</html>
